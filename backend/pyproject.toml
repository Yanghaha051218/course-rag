[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "course-rag-backend"
version = "0.1.0"
description = "FastAPI backend for CourseRAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pymupdf==1.28.2",
  "pydantic-settings==2.15.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
]

[project.scripts]
course-rag = "course_rag_api.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["../tests/backend"]

[tool.setuptools.packages.find]
where = ["src"]
